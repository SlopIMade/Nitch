# Release: on a version tag (v1.2.3) builds the signed TV app and the Docker image, publishes the
# image to Docker Hub (slopimade/nitch:1.2.3 and :latest) and creates a GitHub release with the
# APK. Started by hand (Actions → Release → Run workflow), it builds both without publishing.
#
# Secrets (Settings → Secrets and variables → Actions):
#   NITCH_KEYSTORE_BASE64, NITCH_KEYSTORE_PASSWORD, NITCH_KEY_PASSWORD   scripts/create-apk-key.ps1
#   DOCKERHUB_TOKEN   a Docker Hub access token (Read & Write) of the account below
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: slopimade/nitch
  DOCKERHUB_USER: slopimade
  PUBLISH: ${{ github.ref_type == 'tag' }}

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.8.2
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.NITCH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/nitch.jks"
            echo "NITCH_KEYSTORE_FILE=$RUNNER_TEMP/nitch.jks" >> "$GITHUB_ENV"
          elif [ "$PUBLISH" = true ]; then
            echo "::error::NITCH_KEYSTORE_BASE64 is not set (scripts/create-apk-key.ps1)"; exit 1
          else
            echo "::warning::No signing key: the test build is unsigned"
          fi
      - name: Build
        working-directory: android-tv
        env:
          NITCH_KEYSTORE_PASSWORD: ${{ secrets.NITCH_KEYSTORE_PASSWORD }}
          NITCH_KEY_PASSWORD: ${{ secrets.NITCH_KEY_PASSWORD }}
        run: |
          gradle assembleRelease -PnitchVersion=${{ steps.version.outputs.version }} --console=plain
          mkdir -p ../dist
          for f in app/build/outputs/apk/release/*.apk; do
            cp "$f" "../dist/nitch-tv-${{ steps.version.outputs.version }}.apk"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=test,enable=${{ github.ref_type != 'tag' }}
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: github.ref_type == 'tag'
    needs: [apk, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: apk
          path: dist
      - name: GitHub release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nitch $GITHUB_REF_NAME" \
            --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease) \
            --notes "Docker image: \`docker pull ${IMAGE}:${GITHUB_REF_NAME#v}\` · TV app: the APK below (see docs/INSTALL.md)."
