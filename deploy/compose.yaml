# Nitch from Docker Hub. Put this file and your .env (see .env.example) in one folder, or run it
# from the repository root:
#   docker compose -f deploy/compose.yaml up -d
# To build the image from source instead, add deploy/compose.build.yaml:
#   docker compose -f deploy/compose.yaml -f deploy/compose.build.yaml up -d --build

services:
  nitch:
    image: slopimade/nitch:latest
    # Host networking: reachable on the LAN without port mapping, and the mDNS announcement
    # reaches the TV app.
    network_mode: host
    env_file:
      # Next to this file, or at the repository root.
      - path: .env
        required: false
      - path: ../.env
        required: false
    environment:
      NITCH_BIND: ${NITCH_BIND:-0.0.0.0:8080}
    volumes:
      - nitch-data:/data
    restart: unless-stopped
    # Hardware video encoding: pass the GPU through and set NITCH_ENCODER=va in .env.
    # devices:
    #   - /dev/dri:/dev/dri

volumes:
  nitch-data:
