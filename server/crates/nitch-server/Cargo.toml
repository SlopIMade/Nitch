[package]
name = "nitch-server"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
dotenvy = "0.15.7"
futures = "0.3.34"
mdns-sd = "0.21.7"
nitch-hls = { version = "0.1.0", path = "../nitch-hls" }
nitch-media = { version = "0.1.0", path = "../nitch-media" }
nitch-twitch = { version = "0.1.0", path = "../nitch-twitch" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
