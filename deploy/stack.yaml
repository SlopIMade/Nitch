# Nitch on a home server VM (e.g. a Portainer stack) with the data on an NFS share and VA-API
# through a virtio GPU in AMD native-context mode: see docs/INSTALL.md and D32.
#   Portainer: Stacks → Add stack → Web editor, paste this file, set the variables below.
#   CLI:       docker compose -p nitch --env-file .env -f deploy/stack.yaml up -d
# Everything machine-specific comes from the stack's environment variables (or .env):
#   NITCH_TWITCH_CLIENT_ID, NITCH_TWITCH_CLIENT_SECRET   the Twitch app
#   NITCH_NFS_ADDR, NITCH_NFS_PATH                        the share for the data (path must exist)
#   NITCH_RENDER_GID, NITCH_VIDEO_GID                     getent group render video
#   NITCH_HOST_GALLIUM                                    the host's Mesa library built for the GPU,
#                                                         ls /usr/lib/x86_64-linux-gnu/libgallium-*
# The image's Mesa can't drive the virtio GPU, so the host's VA driver and Mesa library are mounted
# in (D32). If they don't fit, the server falls back to software encoding (x264). On a host whose
# GPU Debian's Mesa supports (AMD/Intel bare metal), remove the two mounts and the variable.

services:
  nitch:
    image: slopimade/nitch:latest
    # Host networking: reachable on the LAN without port mapping, and the mDNS announcement
    # reaches the TV app.
    network_mode: host
    environment:
      NITCH_TWITCH_CLIENT_ID: ${NITCH_TWITCH_CLIENT_ID:?set in the stack variables or .env}
      NITCH_TWITCH_CLIENT_SECRET: ${NITCH_TWITCH_CLIENT_SECRET:?set in the stack variables or .env}
      NITCH_BIND: ${NITCH_BIND:-0.0.0.0:8080}
      # VA-API (D32); falls back to x264 if the VA encoder is missing.
      NITCH_ENCODER: ${NITCH_ENCODER:-va}
      NITCH_MAX_MULTIVIEW: ${NITCH_MAX_MULTIVIEW:-2}
      # GStreamer's plugin registry: local, not on the share.
      XDG_CACHE_HOME: /tmp
    devices:
      - /dev/dri:/dev/dri
    group_add:
      # The host's render and video groups, for /dev/dri.
      - ${NITCH_RENDER_GID:?set getent group render}
      - ${NITCH_VIDEO_GID:?set getent group video}
    volumes:
      # nocopy: Docker would otherwise copy the image's /data ownership onto the share, which
      # a NAS that maps every user to its own refuses.
      - type: volume
        source: nitch-data
        target: /data
        volume:
          nocopy: true
      # Segments are rewritten every second and only needed for a minute: in memory.
      - type: tmpfs
        target: /data/multiview
        tmpfs:
          size: 536870912
          mode: 01777
      # The host's Mesa for its GPU (see above); missing files stop the start instead of
      # silently mounting empty directories.
      - type: bind
        source: /usr/lib/x86_64-linux-gnu/dri/virtio_gpu_drv_video.so
        target: /usr/lib/x86_64-linux-gnu/dri/virtio_gpu_drv_video.so
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NITCH_HOST_GALLIUM:?set ls /usr/lib/x86_64-linux-gnu/libgallium-*}
        target: ${NITCH_HOST_GALLIUM}
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

volumes:
  nitch-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NITCH_NFS_ADDR:?set in the stack variables or .env},nfsvers=4.2,rw,noac
      device: ":${NITCH_NFS_PATH:?set in the stack variables or .env}"
